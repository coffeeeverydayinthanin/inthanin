<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inthanin B2B - สั่งกาแฟ</title>
<meta name="theme-color" content="#1e4d2b">
<meta property="og:title" content="Inthanin B2B - สั่งกาแฟส่งถึงออฟฟิศ">
<meta property="og:description" content="ส่งฟรี · แถมสูงสุด 2 แก้ว · เลือกวันและเวลาส่งเองได้">
<style>
  html,body{margin:0;height:100%;background:#f7efe2}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        font:16px sans-serif;color:#1e4d2b}
</style>
</head>
<body>
<div id="load">กำลังโหลด…</div>
<iframe src="https://script.google.com/macros/s/AKfycbxTqwaXOoZi75jzjP0lA0LqKciVgTUDNTDPfAhL6qrjQPB0H5X2sHan5bV-2JUHpL4/exec"
        allow="clipboard-write; web-share" onload="document.getElementById('load').remove()"></iframe>
<script>
(function () {
  var KEYS = ['inthanin_customer', 'inthanin_last_order'];
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin)) return;
    var d = e.data;
    if (!d || typeof d !== 'object' || !d.inth) return;
    try {
      if (d.inth === 'set' && KEYS.indexOf(d.k) >= 0) {
        localStorage.setItem('w_' + d.k, JSON.stringify(d.v));
      } else if (d.inth === 'remove' && KEYS.indexOf(d.k) >= 0) {
        localStorage.removeItem('w_' + d.k);
      } else if (d.inth === 'get') {
        var out = {};
        KEYS.forEach(function (k) { var v = localStorage.getItem('w_' + k); if (v) out[k] = JSON.parse(v); });
        e.source.postMessage({ inth: 'data', data: out }, e.origin);
      }
    } catch (err) {}
  });
})();
</script>
</body>
</html>
